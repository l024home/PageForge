<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-theme="dark" data-view="card">
  <header class="top-bar">
    <div class="brand">
      <div class="logo">PF</div>
      <div>
        <h1>PageForge</h1>
        <p class="site" id="siteLabel">当前站点：—</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="badge" id="activeCount">0 条生效</span>
      <button id="exportBtn" class="icon-btn" title="导出 CSS / JS 规则（不含主题与跨域）">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
          <path d="M14 3v6h6"/>
          <path d="M12 12v6"/>
          <path d="M9 15l3 3 3-3"/>
        </svg>
      </button>
      <button id="importBtn" class="icon-btn" title="导入 CSS / JS 规则">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
          <path d="M14 3v6h6"/>
          <path d="M12 18v-6"/>
          <path d="M9 15l3-3 3 3"/>
        </svg>
      </button>
      <button id="themeBtn" class="icon-btn" title="切换主题">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button id="viewBtn" class="icon-btn" title="切换为列表展示">
        <svg id="viewIcon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
      </button>
      <button id="refreshBtn" class="icon-btn" title="刷新当前页面注入">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="style">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3c-4.97 0-9 3.58-9 8 0 3.07 2.13 5.64 5.32 7.02L9 21l3-1.5L15 21l.68-2.98C18.87 16.64 21 14.07 21 11c0-4.42-4.03-8-9-8z"/></svg>
      样式管理
    </button>
    <button class="tab" data-tab="script">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      脚本管理
    </button>
    <button class="tab" data-tab="cors">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5.25 3.15.75-1.23-4-2.37V7z"/></svg>
      跨域设置
    </button>
  </nav>

  <main>
    <section id="tab-style" class="tab-panel active">
      <div class="toolbar">
        <button id="addStyleBtn" class="primary">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          新建样式
        </button>
        <input type="search" id="styleSearch" class="search" placeholder="搜索名称或匹配模式…">
      </div>
      <div id="styleList" class="item-list"></div>
    </section>

    <section id="tab-script" class="tab-panel">
      <div class="toolbar">
        <button id="addScriptBtn" class="primary">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          新建脚本
        </button>
        <input type="search" id="scriptSearch" class="search" placeholder="搜索名称或匹配模式…">
      </div>
      <div id="scriptList" class="item-list"></div>
    </section>

    <section id="tab-cors" class="tab-panel">
      <div class="cors-card">
        <div class="cors-header">
          <div>
            <h2>本地调试跨域</h2>
            <p class="hint">仅对 localhost / 127.0.0.1 发起的 XHR/Fetch 生效，回写具体 Origin 并允许凭证。</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="corsToggle">
            <span class="slider"></span>
          </label>
        </div>
        <label class="field">
          <span>目标 Origin</span>
          <div class="input-row">
            <input type="text" id="corsOrigin" value="http://localhost:3000" placeholder="http://localhost:3000">
            <button id="copyOrigin" class="ghost" title="复制">复制</button>
          </div>
        </label>
        <div class="status-row" id="corsStatus">
          <span class="dot off"></span>
          <span id="corsStatusText">未启用</span>
        </div>
        <p class="warning">⚠️ 仅用于开发调试，长期开启会破坏同源安全策略。</p>
      </div>
    </section>
  </main>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <dialog id="editorDialog">
    <form method="dialog">
      <div class="dialog-header">
        <h2 id="editorTitle">编辑</h2>
        <div class="dialog-header-actions">
          <span class="dirty-indicator" id="dirtyIndicator" hidden>● 未保存</span>
          <button type="button" id="closeEditor" class="icon-btn" title="关闭">✕</button>
        </div>
      </div>
      <div class="field-row">
        <label class="field">
          <span>名称</span>
          <input type="text" id="editName" placeholder="我的自定义样式">
        </label>
        <label class="field">
          <span>URL 匹配模式 <small>（留空 = 全部适用）</small></span>
          <input type="text" id="editPattern" placeholder="example.com/* 或 *.example.com 或 /api/* 或留空">
          <small class="field-hint">支持：留空/`*` 全部；`example.com` 自动匹配任意协议路径；`https://a.com/*` 完整通配；`/api/*` 路径匹配。</small>
        </label>
      </div>
      <label class="field">
        <span>代码 <small>（Tab 缩进，Ctrl/Cmd+S 保存）</small></span>
        <div class="code-wrap">
          <pre class="line-numbers" id="lineNumbers">1</pre>
          <div class="code-editor">
            <pre class="code-highlight" id="codeHighlight" aria-hidden="true"></pre>
            <textarea id="editCode" spellcheck="false" placeholder="/* CSS 或 JavaScript */"></textarea>
          </div>
        </div>
      </label>
      <div class="dialog-actions">
        <button type="button" id="deleteItem" class="danger">删除</button>
        <div class="dialog-actions-right">
          <button type="button" id="cancelItem" class="ghost">取消</button>
          <button type="button" id="saveItem" class="primary">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- 导入模式弹层 -->
  <dialog id="importDialog">
    <form method="dialog">
      <div class="dialog-header">
        <h2>导入规则</h2>
        <button type="button" id="closeImport" class="icon-btn" title="关闭">✕</button>
      </div>
      <p class="hint" id="importSummary">选择导入方式：</p>
      <p class="warning" id="importConflictHint" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="importCancel" class="ghost">取消</button>
        <div class="dialog-actions-right">
          <button type="button" id="importMerge" class="ghost">合并到现有规则</button>
          <button type="button" id="importReplace" class="primary">覆盖现有规则</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- 导出说明弹层 -->
  <dialog id="exportDialog">
    <form method="dialog">
      <div class="dialog-header">
        <h2>导出规则</h2>
        <button type="button" id="closeExport" class="icon-btn" title="关闭">✕</button>
      </div>
      <p class="hint">将导出你创建的所有 CSS 样式与 JS 脚本规则（含启用状态、URL 匹配模式）。</p>
      <p class="hint">不包含主题、展示方式和跨域设置。</p>
      <div class="dialog-actions">
        <button type="button" id="exportCancel" class="ghost">取消</button>
        <div class="dialog-actions-right">
          <button type="button" id="exportConfirm" class="primary">导出 JSON</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="panel.js"></script>
</body>
</html>
